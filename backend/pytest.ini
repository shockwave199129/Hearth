[pytest]
# Rooted at backend/ so `app.*` imports resolve without every test file
# re-doing the sys.path.insert dance in conftest.py.
testpaths = tests
pythonpath = .

# --strict-markers: a typo'd marker becomes an error instead of silently
# applying nothing — which for `perf` would mean a wall-clock test quietly
# rejoining the CI gate it was deliberately taken out of.
addopts = -q --strict-markers

markers =
    perf: wall-clock/latency budget checks. Excluded from CI via
        `-m "not perf"` because shared runners measure the runner, not the
        code. Run on real target hardware with `pytest -m perf`.
