# Region-specific resources layered on top of global.yaml when the
# profile's region is "uk" (Book Vol 6 Ch 7). Public, well-known services.
last_updated: "2026-08-14"
source_notes: >-
  Every entry below re-checked against the operating organisation's own
  official page on 2026-08-14: samaritans.org (116 123 — free from any
  phone, 24/7/365, UK and Ireland, does not appear on phone bills),
  crisistextline.uk / giveusashout.org (SHOUT to 85258 — England,
  Scotland, Wales, Northern Ireland), nationaldahelpline.org.uk (0808 2000
  247 — Refuge-operated, freephone, 24 hours every day). Numbers and
  keywords matched exactly; no corrections were needed.

  This is contact-accuracy verification only. It is NOT the clinical review
  required before real-user exposure — whether these are the right resources
  to surface, for which categories, and with what wording, still NEEDS
  REVIEW by a qualified safety/clinical professional (Vol 6 Ch 7). See
  docs/compliance.md.
resources:
  - id: uk_samaritans
    title: Samaritans
    description: "Call 116 123, free, 24/7, from any phone in the UK or Ireland."
    contact: "116 123"
    region: uk
    category: acute_self_risk
    verified: true
  - id: uk_shout_crisis_text_line
    title: Shout Crisis Text Line
    description: "Free, 24/7 text-based crisis support. Text SHOUT to 85258."
    contact: "85258"
    region: uk
    category: acute_self_risk
    verified: true
  - id: uk_national_domestic_abuse_helpline
    title: National Domestic Abuse Helpline
    description: "Call 0808 2000 247, free and confidential, 24/7."
    contact: "0808 2000 247"
    region: uk
    category: disclosed_harm_to_others
    verified: true
