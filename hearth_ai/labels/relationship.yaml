# Hearth RelationshipHead — regression (SmoothL1Loss)
# Outputs continuous relationship signals for the Relationship Worker.
# Durable trust/attachment writes remain Growth-Engine-owned (Book invariant).
task: relationship
loss: smooth_l1
num_signals: 4

signals:
  - name: trust_delta
    description: Suggested change in trust from this turn
    range: [-1.0, 1.0]
  - name: vulnerability
    description: How much vulnerability the user showed
    range: [0.0, 1.0]
  - name: openness
    description: Conversational openness / disclosure depth
    range: [0.0, 1.0]
  - name: comfort
    description: How comfortable / safe the user appears
    range: [0.0, 1.0]

# At inference, apply tanh to bipolar dims (trust_delta) if needed.
inference:
  trust_delta_activation: tanh
  vulnerability_activation: none
  openness_activation: none
  comfort_activation: none

# JSONL: {"text": "...", "signals": [trust_delta, vulnerability, openness, comfort]}
jsonl_fields:
  - signals
