# Hearth EmotionHead — multi-label (BCEWithLogitsLoss)
# Train labels = GoEmotions 27 emotions + neutral (28).
task: emotion
loss: bce_with_logits
multi_label: true
num_labels: 28

labels:
  - admiration
  - amusement
  - anger
  - annoyance
  - approval
  - caring
  - confusion
  - curiosity
  - desire
  - disappointment
  - disapproval
  - disgust
  - embarrassment
  - excitement
  - fear
  - gratitude
  - grief
  - joy
  - love
  - nervousness
  - optimism
  - pride
  - realization
  - relief
  - remorse
  - sadness
  - surprise
  - neutral

# Collapse train labels → MindState display (14).
# At inference: take active GoEmotions (score > threshold), map each, then
# pick the highest-scoring Hearth label (or unknown if none).
hearth_display:
  - joy
  - sadness
  - anger
  - fear
  - anxiety
  - disgust
  - surprise
  - gratitude
  - loneliness
  - guilt
  - pride
  - hope
  - neutral
  - unknown

# go_emotion -> hearth_display
goemotions_to_hearth:
  admiration: pride
  amusement: joy
  anger: anger
  annoyance: anger
  approval: pride
  caring: gratitude
  confusion: anxiety
  curiosity: hope
