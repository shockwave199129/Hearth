name: Feature request
description: A new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or friction does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Keep privacy/local-first constraints in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other approaches you thought about.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This does not require sending user journal/memory data off-device (or any such path is explicit opt-in and documented).
          required: true
