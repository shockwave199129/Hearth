name: Deploy website to GitHub Pages

# Builds the Astro product site in website/ and publishes it via the official
# Pages actions. Brand images are synced from /assets at build time.
#
# One-time setup after this lands on main:
#   Repo Settings → Pages → Build and deployment → Source: GitHub Actions
# Site URL: https://shockwave199129.github.io/Hearth/
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build
        working-directory: website
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
