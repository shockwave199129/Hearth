name: Build desktop installers

# Grant the GITHUB_TOKEN sufficient scopes to create releases.
permissions:
  # Needed to create a draft release and upload assets. The `contents`
  # permission also grants the ability to create releases.
  contents: write

# Tauri bundlers are native, OS-specific tooling — a .msi can only be built
# on Windows, a .dmg only on macOS, deb/rpm only on Linux. This matrix is
# the practical way to get all three without owning three machines. See
# desktop/src-tauri/tauri.conf.json's bundle.targets (deb/rpm, msi/nsis,
# app/dmg — deliberately no appimage) and desktop/src-tauri/README.md for
# what's still scaffold-only (unsigned builds).
#
# One job per OS+arch, not per hardware tier — the backend freeze is a
# THIN build (requirements-common.txt only, no torch/onnxruntime/
# parler-tts/ttstokenizer). CI has no GPU to match those against anyway;
# that decision (and which CUDA/ROCm/DirectML variant to use) now happens
# on the user's own machine at first run instead, via a bundled standalone
# Python (scripts/fetch_setup_python.py) and backend/app/setup/'s
# /api/setup/* endpoints. This used to matrix across a GPU/CPU tier axis
# too (six jobs, Hearth-GPU/Hearth-CPU installers) — collapsed back to
# per-platform-only now that no installer needs to differ by tier at all.
#
# Five jobs: x64 + ARM64 for Linux/Windows, Apple Silicon-only for macOS.
# Each is a native build on a matching-architecture runner (not
# cross-compiled), so Rust/PyInstaller/etc. all just target the host by
# default — no extra toolchain config needed. macos-26 (not macos-latest,
# which currently resolves to macOS 15) — confirmed GA, not preview, via
# actions/runner-images' own table.
#
# macOS Intel (macos-26-intel) was tried and reverted: caught on a real
# CI run, moonshine-voice (the STT engine, required on every tier via
# requirements-common.txt) has never published a macOS x86_64 wheel for
# any version >=0.0.60 — confirmed by checking its entire release history
# on PyPI. A handful of older versions (0.0.30-0.0.59, inconsistently)
# published a universal2 wheel that would have covered Intel too, but
# those predate the >=0.0.68 floor this project pins to specifically
# because that's the version actually verified working end-to-end (see
# requirements-common.txt) — not worth the risk of un-verifying that for
# Intel Mac support. Windows/Linux ARM64 (windows-11-arm,
# ubuntu-22.04-arm) hit no equivalent dependency gap and remain in the
# matrix; they're also standard (free) runners, unlike macOS Intel would
# have been (GitHub only offers Intel macOS as an always-paid "-large"
# tier as of macOS 14+, confirmed via GitHub's own billing docs) — moot
# now, but worth remembering if Intel Mac ever comes back into scope.
#
# Each job freezes the Python backend (PyInstaller), fetches a bundled
# llama-server, and fetches the bundled setup-time Python, so the
# resulting installer needs none of them pre-installed on the end user's
# machine — see backend/hearth-backend.spec, scripts/build_backend.sh/.ps1,
# scripts/fetch_llama_cpp.py, and scripts/fetch_setup_python.py. Both
# fetch scripts' platform->asset maps were extended for every new
# OS+arch combination here, verified against each upstream release's
# actual asset list (not assumed) before adding.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - windows-latest
          - windows-11-arm
          - macos-26
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Both Linux runners (x64 and arm64) need these — the same
      # webkit2gtk/gtk3/glib dev packages documented in
      # desktop/src-tauri/README.md's "Linux build prerequisites".
      - name: Install Linux system dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev \
            build-essential curl wget file libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fresh runner, no node_modules — install before tauri-action tries to
      # run beforeBuildCommand (pnpm --dir ../../frontend run build, see
      # tauri.conf.json) or invoke the Tauri CLI from desktop/.
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop (Tauri CLI) dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # Derive version from the v* tag before freezing so backend/app/VERSION
      # and the Tauri installer share one number (v0.3.4 → 0.3.4).
      # workflow_dispatch (no tag) stays at 0.0.0 — MSI ProductVersion must
      # be numeric major.minor.build with no pre-release suffix.
      - name: Determine app version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0"
          fi
          echo "value=${ver}" >> "$GITHUB_OUTPUT"
          echo "HEARTH_APP_VERSION=${ver}" >> "$GITHUB_ENV"
          echo "App version: ${ver}"

      # Populates desktop/src-tauri/resources/hearth-backend/ — thin build,
      # see backend/hearth-backend.spec and scripts/build_backend.sh/.ps1.
      - name: Freeze backend (Linux/macOS)
        if: "!contains(matrix.platform, 'windows')"
        run: bash scripts/build_backend.sh

      - name: Freeze backend (Windows)
        if: contains(matrix.platform, 'windows')
        run: pwsh scripts/build_backend.ps1

      # Populates desktop/src-tauri/resources/llama-cpp/ — CPU-only on
      # Linux/Windows, Metal-included on macOS (its only variant). See
      # scripts/fetch_llama_cpp.py for exactly what's and isn't bundled.
      - name: Fetch bundled llama-server
        run: |
          uv pip install --quiet --system requests
          python scripts/fetch_llama_cpp.py

      # Populates desktop/src-tauri/resources/setup-python/ — the
      # standalone Python the in-app setup screen uses to pip-install the
      # hardware-matched torch/onnxruntime build at first run. See
      # scripts/fetch_setup_python.py and backend/app/setup/installer.py.
      - name: Fetch bundled setup Python
        run: python scripts/fetch_setup_python.py

      # Code signing / notarization — no-ops when the matching secrets are
      # unset, so unsigned draft builds keep working until certificates are
      # provisioned. Required secrets (see desktop/src-tauri/README.md):
      #   macOS: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      #          APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific),
      #          APPLE_TEAM_ID
      #   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
      #   Updater (optional): TAURI_SIGNING_PRIVATE_KEY,
      #                       TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      #
      # The Apple credentials reach the build through $GITHUB_ENV rather than
      # an `env:` block on the build step. An unset secret still defines the
      # variable as an empty string, and every signing check in the bundler
      # asks whether the variable exists (`var_os`), never whether it holds
      # anything — so an empty APPLE_CERTIFICATE made Tauri run `security
      # import` against a zero-byte .p12 and fail the entire bundle instead
      # of falling back to unsigned. $GITHUB_ENV only defines what we write.
      - name: Import Apple Developer certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: hearth-ci-temp
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE unset — building unsigned (Gatekeeper will block distribution)."
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/hearth_dev_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/hearth-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # The certificate is in the keychain now, so the bundler only needs
          # the identity to look it up; forwarding APPLE_CERTIFICATE as well
          # would just make it repeat the import. Notarization is skipped
          # unless all three of its variables are present, so export each one
          # only when it actually has a value.
          for var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!var}" ]; then
              echo "$var=${!var}" >> "$GITHUB_ENV"
            fi
          done

      - name: Import Windows code-signing certificate
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "WINDOWS_CERTIFICATE unset — building unsigned (SmartScreen will warn)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "hearth-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          echo "WINDOWS_CERTIFICATE_PATH=$pfx" >> $env:GITHUB_ENV

      # Same presence-not-emptiness rule as the Apple credentials above: an
      # empty updater key would be treated as a real one.
      - name: Configure updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for var in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!var}" ]; then
              echo "$var=${!var}" >> "$GITHUB_ENV"
            fi
          done

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Hearth ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Override tauri.conf.json's placeholder 0.0.0. Single-quoted, no
          # spaces — tauri-action's arg tokenizer doesn't understand
          # backslash-escaped quotes or embedded spaces.
          args: --config '{"version":"${{ steps.version.outputs.value }}"}'
