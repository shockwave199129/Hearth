[package]
name = "hearth"
version = "0.1.0"
description = "Hearth desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Do NOT add the "devtools" feature. Without it Tauri omits the inspector
# from release builds entirely, which is what actually keeps the developer
# window out of a shipped Hearth — frontend/src/lib/devtools.ts only blocks
# the keyboard shortcuts, and a keypress handler is not a boundary.
# `tauri dev` still gets devtools regardless; debug builds always include it.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v4 only, for the per-launch local API token (see main.rs's api_token) —
# a CSPRNG-backed 122-bit value, not an identifier.
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "hearth"
path = "src/main.rs"
